[project]
name = "filebridge-agent"
version = "0.1.0"
description = "部署在 B 上的 agent：主动外连 A，按指令把文件分片上传。只读、不执行命令。"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "websockets>=13",
    "httpx>=0.27",
    "pydantic>=2.8",
]

[project.scripts]
filebridge-agent = "filebridge_agent.main:main"

# 无 workspace、无 path 依赖：本项目可以单独 clone、单独 build、单独装到 B 上。
# 线上协议在 src/filebridge_agent/protocol.py 里，与 server 那份必须逐字节一致
# （由 tests/test_protocol.py 比对，改协议必须同时改两边）。
[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.7", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
