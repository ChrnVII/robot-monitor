# FileBridge A 端反代。TLS 用 certbot 或自己的证书，这里只写关键项。
#
# 四个必须显式处理的点，少一个就会出现"本地好好的、上线就不对"：
#   1. client_max_body_size   默认 1MB，8MB 的分片会全被 413 打回
#   2. proxy_request_buffering off  否则 Nginx 先把整块收进临时文件再转发，慢一倍
#   3. /api/events 关 buffering    否则 SSE 被攒在代理层，进度一段一段跳
#   4. /ws/agent 升级头 + 长超时   否则控制连接每分钟被掐一次

server {
    listen 80;
    server_name files.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name files.example.com;

    ssl_certificate     /etc/letsencrypt/live/files.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/files.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 32m;          # 8MB 分片 + 请求头余量
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;

    # 实时事件流：不能缓冲、不能断
    location = /api/events {
        proxy_pass http://127.0.0.1:8000;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;
    }

    # B 的控制通道：必须支持 Upgrade，且超时要长（空闲时靠心跳维持）
    location = /ws/agent {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # B 的分片上传：长超时，不缓冲
    location /internal/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
