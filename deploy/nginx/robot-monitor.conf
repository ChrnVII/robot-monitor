# Robot Monitor A 端反代。TLS 用 certbot 或自己的证书，这里只写关键项。
#
# 六个必须显式处理的点，少一个就会出现"本地好好的、上线就不对"：
#   1. client_max_body_size   默认 1MB，8MB 的分片会全被 413 打回
#   2. proxy_request_buffering off  否则 Nginx 先把整块收进临时文件再转发，慢一倍
#   3. /api/events 关 buffering    否则 SSE 被攒在代理层，进度一段一段跳
#   4. /ws/agent 升级头 + 长超时   否则控制连接每分钟被掐一次
#   5. /ws/agent/media 与 /ws/live/ 也要升级头
#      ——新增的 WS 路径如果只加在应用里、忘了加在这里，线上握手直接 400，
#        而本地（直连 uvicorn）永远复现不出来。上线前必须用 websocat 验一遍。
#   6. /internal/ 的 body 上限      事件批量与快照回传都在这个前缀下

server {
    listen 80;
    server_name files.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name files.example.com;

    ssl_certificate     /etc/letsencrypt/live/files.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/files.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 32m;          # 8MB 分片 + 请求头余量
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;

    # 实时事件流：不能缓冲、不能断
    location = /api/events {
        proxy_pass http://127.0.0.1:8000;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;
    }

    # B 的控制通道：必须支持 Upgrade，且超时要长（空闲时靠心跳维持）
    location = /ws/agent {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # B 的媒体上行通道（C1）：一路 RTSP 只在这里出现一次，观众数不影响机器人出口带宽。
    # 关键帧间隔 1s，正常 1 秒内必有数据；read_timeout 仍然给足，
    # 因为弱网下上游可能整体静默几十秒，连接不该被代理层掐断——
    # 画面停不停由应用层的 last_frame_at 判定，不由 TCP 连接状态判定。
    location = /ws/agent/media {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # C 的直播通道：云端扇出给浏览器。同样必须升级 + 不缓冲，
    # 否则帧被 Nginx 攒成一批再发，端到端延迟会从 300ms 涨到几秒。
    location /ws/live/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # B 的批量上报与分片上传：长超时，不缓冲。
    # 事件批量（POST /internal/events）一次最多 50 条，体量远小于分片；
    # 快照回传（POST /internal/snapshot/{id}）是单张 JPEG（10–30 KB）。
    # 这里统一收到 16m：既覆盖 8MB 分片 + 请求头余量，也不会意外放开成 32m。
    location /internal/ {
        proxy_pass http://127.0.0.1:8000;
        client_max_body_size 16m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
