[project]
name = "robot-monitor-server"
version = "0.1.0"
description = "部署在 A 上的后端：WebSocket 控制通道 + 分片接收 + 文件库 + 前端静态托管"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.4",
    "argon2-cffi>=23.1",
    "aiosqlite>=0.20",
]

[project.scripts]
robot-monitor-server = "robot_monitor_server.main:main"

# 无 workspace、无 path 依赖：本项目可以单独 clone、单独 build、单独部署到 A 上。
# 线上协议在 src/robot_monitor_server/protocol.py；与机器侧实现的一致性由
# tests/contracts/protocol-frames.json 的黄金样例保证（两端各跑一遍）。
[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
# 端到端测试用 tests/support/mini_agent.py 自带的协议级替身，不依赖任何外部项目。
dev = [
    "pytest>=8.0",
    "ruff>=0.7",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "websockets>=13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
